server {
    listen 80;
    server_name _;

    # Enable gzip compression for common text-based assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Forward requests to the Astro Node.js app
        proxy_pass http://app:4321;

        # Pass original request headers to the upstream app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tell the app it's being served over HTTPS (hardcoded since Cloudflare terminates TLS)
        proxy_set_header X-Forwarded-Proto https;

        # Astro streams the SSR response with Transfer-Encoding: chunked (no Content-Length).
        # nginx buffers the full response anyway (proxy_buffering on by default), so compute
        # a real Content-Length instead of relaying chunked framing downstream — the tunnel
        # (cloudflared) mishandles chunked bodies on reused keep-alive connections, truncating
        # the response at an arbitrary point under concurrent load.
        chunked_transfer_encoding off;
    }
}
